# Build standalone executables on each push/PR; create a draft GitHub Release on version tags.
# Publishing the release triggers release-pypi.yml (PyPI upload).

name: Build

on: [push, pull_request]

jobs:
  build-binaries:
    name: Build binaries for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-amd64
          - linux-amd64
          - macos-amd64
          - macos-arm64
          - linux-aarch64
        include:
          - platform: windows-amd64
            runner: windows-latest
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: macos-amd64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    env:
      DISTPATH: espins-${{ matrix.platform }}
      TARGETS_DIR: esp_gpio_tool_cli/targets/
      RESOURCES_DIR: esp_gpio_tool/resources/
      UV_PYTHON: "3.10"
      UV_VENV_CLEAR: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Build CLI executable
        uses: espressif/python-binary-action@master
        with:
          scripts: esp_gpio_tool_cli/__main__.py
          script-name: espins-cli
          output-dir: ./${{ env.DISTPATH }}
          target-platform: ${{ matrix.platform }}
          python-version: "3.10"
          icon-file: ${{ matrix.platform == 'windows-amd64' && 'esp_gpio_tool/resources/espressif-logo.ico' || '' }}
          include-data-dirs: |
            {
              "esp_gpio_tool_cli/__main__.py": ["${{ env.TARGETS_DIR }}"]
            }
          additional-args: --collect-submodules=rich._unicode_data

      - name: Add license and readme
        shell: bash
        run: cp LICENSE README.md ./${{ env.DISTPATH }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DISTPATH }}
          path: ${{ env.DISTPATH }}

  create-release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install release tooling
        run: |
          python -m pip install -U pip
          python -m pip install -U commitizen czespressif

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cz changelog "${VERSION}" --file-name release_notes.md

      - name: Download built binaries
        uses: actions/download-artifact@v8

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in espins-*; do
            platform="${dir#espins-}"
            if [[ "${platform}" == windows-* ]]; then
              zip -r "espins-v${VERSION}-${platform}.zip" "${dir}"
            else
              chmod -R u=rwx,g=rx,o=rx "${dir}"
              tar -cvzf "espins-v${VERSION}-${platform}.tar.gz" "${dir}"
            fi
          done

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release_notes.md
          files: |
            espins-v*.zip
            espins-v*.tar.gz
